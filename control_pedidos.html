<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="estilos.css">

<script>
async function verificarAccesoPedidos(){
 let claveFirebase = "1234";

 try{
   const doc = await cloudDB.collection("configuracion").doc("tienda").get();

   if(doc.exists && doc.data().claveAdmin){
      claveFirebase = doc.data().claveAdmin;
   }

 }catch(e){
   console.error("Error leyendo contraseña Firebase", e);
 }

 const clave = prompt("Ingrese contraseña de administrador:");

 if(clave !== claveFirebase){
   alert("Contraseña incorrecta");
   window.location.href="inicio.html";
   return;
 }

 cargarControlPedidos();
}
</script>

</head>
<body onload="verificarAccesoPedidos()">
<header><h1>📋 Control de Pedidos</h1></header>
<input id="buscadorPedidos" class="buscador" placeholder="🔎 Buscar por número de pedido" onkeyup="filtrarPedidos()"><div id="listaPedidos"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<script src="firebase-cloud.js"></script>
<script src="app.js"></script>
<script>
if('serviceWorker' in navigator){
 navigator.serviceWorker.register('service-worker.js');
}
</script>
</body>
</html>
